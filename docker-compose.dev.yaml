services:
  app:
    build:
      context: .
      target: dev
    environment:
      - ENV=development
      - DEBUG=True
    container_name: fitter
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - ./backend/app:/backend/app
      - ./backend/alembic:/backend/alembic
      - ./backend/alembic.ini:/backend/alembic.ini
      - ./backend/tests:/backend/tests
      - ./backend/requirements.txt:/backend/requirements.txt
      - ./backend/requirements-dev.txt:/backend/requirements-dev.txt
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: .
      target: frontend-dev
    container_name: fitter-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - app
